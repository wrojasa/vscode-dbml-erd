name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # integration test inside a downloaded VS Code (needs a display on Linux)
      - run: xvfb-run -a npm run test:vscode
      - run: npx vsce package --out vscode-dbml-erd.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-dbml-erd.vsix
